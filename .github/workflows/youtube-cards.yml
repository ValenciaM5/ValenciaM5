name: GitHub Readme YouTube Cards
 
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: UCbJ5w7qVjWZElbVnC2aU_kg
          comment_tag_name: YOUTUBE-CARDS
          max_videos: 6
 
